[project]
name = "bakehaus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cultuly (kirill)", email = "cultuly@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
bakehaus = "api.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["api", "core", "database"]
